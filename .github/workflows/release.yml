# Tag release: build measured Rust InferenceEngine linux-amd64 runtime bundle.
#
# Attestation fingerprints both the runtime tarball (ieRuntimeSha256) and the ELF
# (engine.binary_sha256 / ieBinarySha256). Tag with train semver (e.g. v0.9.3).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Pack runtime
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export TEECHAT_ENGINE_BUILD_VERSION="$VERSION"
          export TEECHAT_IE_PACK_OUT="$PWD/dist/release"
          bash scripts/pack-runtime.sh
          test -f dist/release/SHA256SUMS
          test -f dist/release/RELEASE_MANIFEST.json
          test -f "dist/release/inference-engine-runtime-${VERSION}.tar.gz"
          cat dist/release/SHA256SUMS
          cat dist/release/RELEASE_MANIFEST.json
          # Chat SPA verify cannot CORS-read GitHub asset downloads; it fingerprints
          # api.github.com release `body` + asset `digest`. Embed SHA256SUMS in notes.
          {
            echo "## Measured artifact"
            echo
            echo "- **\`inference-engine-runtime-*.tar.gz\`** — runtime tarball (\`ieRuntimeSha256\`)"
            echo "- **\`bin/teechat-inference-engine\`** — ELF fingerprint (\`engine.binary_sha256\` / \`ieBinarySha256\`)"
            echo "- OPE FFI / attested-mtls: \`RELEASE_MANIFEST.json\` (independent TCBs; verify on their own Releases)"
            echo
            echo "Install / cutover: TeeChat \`docs/ops/engine-blue-green-cutover.md\` (Rust IE train)."
            echo
            echo "## SHA256SUMS"
            echo
            echo '```'
            cat dist/release/SHA256SUMS
            echo '```'
          } > dist/release/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/inference-engine-runtime-*.tar.gz
            dist/release/SHA256SUMS
            dist/release/RELEASE_MANIFEST.json
          generate_release_notes: true
          body_path: dist/release/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
